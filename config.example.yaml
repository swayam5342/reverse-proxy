server:
  addr: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s
  read_header_timeout: 5s
  shutdown_timeout: 30s
  # Overall deadline per request, retries and backoff included. Must be
  # shorter than write_timeout so the 504 can still be written, and at least
  # every upstream request_timeout.
  request_timeout: 9s
  # Max lifetime of an upgraded (WebSocket) connection.
  upgrade_timeout: 1h
  # Request bodies above this get 413. 0 disables the limit.
  max_body_bytes: 10485760 # 10 MiB
  # CIDRs or IPs of the load balancers in front of the gateway.
  # X-Forwarded-For is only honored when the direct peer is one of these.
  # Leave empty if clients connect to the gateway directly.
  trusted_proxies: []
  #  - 10.0.0.0/8

# TLS termination. "off" serves plaintext (local dev, or TLS terminated in
# front of the gateway). In production use "acme" (automatic Let's Encrypt)
# or "files" (your own certificate, reloaded when renewed). With TLS on,
# server.addr defaults to ":443" and http_addr serves ACME challenges and
# redirects to HTTPS. See deploy/config.prod.yaml for a full example.
tls:
  mode: "off"
  # http_addr: ":80"
  # acme:
  #   domains: ["api.example.com"]
  #   email: "ops@example.com"
  #   cache_dir: "/var/lib/jgateway/acme"
  # files:
  #   cert_file: /etc/jgateway/tls/fullchain.pem
  #   key_file: /etc/jgateway/tls/privkey.pem

# Shared rate-limit store. With it, every gateway copy shares one set of
# limits; while Valkey is unreachable each copy falls back to in-memory
# limits and switches back automatically. Omit to use in-memory limits only.
# valkey:
#   addr: "valkey:6379"
#   password_env: VALKEY_PASSWORD
#   db: 0
#   tls: false
#   timeout: 50ms

upstreams:
  - name: users-api
    url: "http://users-api.internal:8081"
    dial_timeout: 2s
    request_timeout: 2s # x3 attempts + backoff fits within server.request_timeout
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      half_open_probe_after: 30s
      half_open_max_requests: 1
    retry:
      enabled: true
      max_attempts: 3
      base_backoff: 100ms
      max_backoff: 2s

  - name: orders-api
    url: "http://orders-api.internal:8082"
    dial_timeout: 2s
    request_timeout: 8s
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      half_open_probe_after: 30s
      half_open_max_requests: 1
    retry:
      enabled: false

routes:
  - path_prefix: "/api/users"
    upstream: users-api
    auth:
      enabled: true
      mode: jwt
      jwt_secret_env: JWT_SECRET
      # Or, for an identity provider (Auth0, Cognito, Keycloak, ...), use
      # its PEM public key or certificate instead of a shared secret:
      # jwt_public_key_env: JWT_PUBLIC_KEY
      # issuer: "https://your-tenant.example.com/"
      # audience: "users-api"
      # leeway: 30s
    rate_limit:
      enabled: true
      requests_per_second: 50
      burst: 100
      key_strategy: api_key

  - path_prefix: "/api/orders"
    upstream: orders-api
    auth:
      enabled: true
      mode: api_key
      api_keys_env: ORDERS_API_KEYS
    rate_limit:
      enabled: true
      requests_per_second: 20
      burst: 40
      key_strategy: api_key_ip
    signing:
      enabled: true
      secret_env: ORDERS_SIGNING_SECRET
      header_name: X-Signature
      tolerance_seconds: 300
