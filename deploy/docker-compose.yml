# Single-server deployment: the gateway terminates TLS on 443 (automatic
# Let's Encrypt), redirects 80 to HTTPS, and shares rate limits through
# Valkey. See docs/deployment.md ("Single server with compose").
#
#   cp deploy/.env.example deploy/.env   # then set real secrets
#   docker compose -f deploy/docker-compose.yml up -d

services:
  gateway:
    build: ..
    restart: unless-stopped
    ports:
      - "443:8443"
      - "80:8080"
      # 9090 (admin: health, readiness, metrics) is deliberately not published.
    env_file: .env
    volumes:
      - ./config.prod.yaml:/app/config.yaml:ro
      - acme:/var/lib/jgateway
    extra_hosts:
      # Lets the config reach an app running directly on this host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/app/gateway", "-healthcheck", "-healthcheck-url", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Longer than server.shutdown_timeout (25s) so in-flight requests drain.
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1.1
    restart: unless-stopped
    # Rate-limit state is short-lived: no persistence needed.
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}", "--appendonly", "no", "--save", ""]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    # No published ports: reachable only by the gateway on the compose network.

volumes:
  acme:
