apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: admin # health, readiness, metrics; not exposed by the Service
          env:
            # The image defaults admin_addr to 127.0.0.1:9090; kubelet probes
            # and Prometheus need it on the pod IP.
            - name: GATEWAY_ADMIN_ADDR
              value: ":9090"
          envFrom:
            - secretRef:
                name: gateway-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          # Give in-flight requests time to drain during a rolling deploy;
          # must be >= server.shutdown_timeout in config.yaml.
          lifecycle:
            preStop:
              # Built-in sleep action (Kubernetes 1.30+): the distroless image
              # has no sleep binary, so an exec hook would fail.
              sleep:
                seconds: 5
      terminationGracePeriodSeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080
