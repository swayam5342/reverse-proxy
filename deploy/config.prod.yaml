# Production config for the single-server compose deployment
# (deploy/docker-compose.yml). Copy it, replace every example.com value and
# the upstream URL, and keep secrets in deploy/.env (never in this file).
#
# Inside the container the gateway listens on unprivileged ports; compose
# publishes them as 443 -> 8443 and 80 -> 8080. The admin port (9090) is
# reachable on the compose network only, never published.

server:
  addr: ":8443"
  admin_addr: ":9090"
  read_timeout: 10s
  read_header_timeout: 5s
  write_timeout: 30s
  idle_timeout: 120s
  # Keep below the compose stop_grace_period (30s) so draining finishes
  # before Docker kills the container.
  shutdown_timeout: 25s
  # Overall deadline per request, retries included; must stay below
  # write_timeout and at least every upstream request_timeout.
  request_timeout: 25s
  upgrade_timeout: 1h
  max_body_bytes: 10485760 # 10 MiB
  # The gateway is the edge (no load balancer in front), so no proxy is
  # trusted for X-Forwarded-For. If you put Cloudflare or an LB in front,
  # list its address ranges here.
  trusted_proxies: []

tls:
  mode: acme
  http_addr: ":8080" # ACME HTTP-01 challenges + redirect to HTTPS
  acme:
    domains: ["api.example.com"]
    email: "ops@example.com"
    cache_dir: /var/lib/jgateway/acme # the "acme" volume; must persist
  # To use your own certificate instead (e.g. a Cloudflare origin cert):
  # mode: files
  # files:
  #   cert_file: /etc/jgateway/tls/fullchain.pem
  #   key_file: /etc/jgateway/tls/privkey.pem

valkey:
  addr: "valkey:6379"
  password_env: VALKEY_PASSWORD
  timeout: 50ms

upstreams:
  # Your application server. host.docker.internal reaches a process
  # running directly on the host (compose maps it via extra_hosts); use
  # the service name instead (e.g. http://app:3000) if it runs in compose.
  - name: app
    url: "http://host.docker.internal:3000"
    dial_timeout: 2s
    request_timeout: 20s
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      half_open_probe_after: 30s
      half_open_max_requests: 1
    retry:
      enabled: true
      max_attempts: 2
      base_backoff: 100ms
      max_backoff: 1s

routes:
  # Browser frontend: JWT in the Authorization header, or in the "session"
  # cookie (cookie requests must pass the cross-origin check).
  - path_prefix: "/api"
    upstream: app
    cors:
      enabled: true
      allowed_origins: ["https://app.example.com"]
      allowed_headers: [Authorization, Content-Type, Idempotency-Key]
      expose_headers: [X-Request-Id]
      allow_credentials: true
      max_age: 10m
    auth:
      enabled: true
      mode: jwt
      jwt_secret_env: JWT_SECRET
      jwt_cookie: session
      # For an identity provider, use its public key instead:
      # jwt_public_key_env: JWT_PUBLIC_KEY
      # issuer: "https://your-tenant.example.com/"
      # audience: "api"
      leeway: 30s
    rate_limit:
      enabled: true
      requests_per_second: 20
      burst: 40
      key_strategy: api_key_ip

  # Other services: named API keys (SERVICE_API_KEYS=name:key,...).
  - path_prefix: "/internal"
    upstream: app
    auth:
      enabled: true
      mode: api_key
      api_keys_env: SERVICE_API_KEYS
    rate_limit:
      enabled: true
      requests_per_second: 100
      burst: 200
      key_strategy: api_key
